<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 반 시계 위젯</title>
<link rel="icon" href="../favicon.png">
<style>
@font-face{font-family:"Allimjang";src:url("../fonts/allimjang-r.woff2") format("woff2");font-weight:400 500;font-display:swap}
@font-face{font-family:"Allimjang";src:url("../fonts/allimjang-b.woff2") format("woff2");font-weight:600 900;font-display:swap}
@font-face{font-family:"Freesentation";src:url("../fonts/freesentation-400.woff2") format("woff2");font-weight:300 500;font-display:swap}
@font-face{font-family:"Freesentation";src:url("../fonts/freesentation-700.woff2") format("woff2");font-weight:600 700;font-display:swap}
@font-face{font-family:"Freesentation";src:url("../fonts/freesentation-800.woff2") format("woff2");font-weight:800 900;font-display:swap}
:root{--ink:#22303f;--sub:#6b7785;--line:#e3e8ee;--bg:#f6f8fb;--card:#fff;--pt:#2f7bf6;--pt2:#e8f0ff;--warm:#ff8a3d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Freesentation,"Malgun Gothic",sans-serif;color:var(--ink)}
body{background:transparent;overflow:hidden;user-select:none}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ── 시계 보기 ── */
#vClock{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;-webkit-app-region:drag;cursor:grab}
body.web #vClock{background:#eef2f6}
#stage{position:relative;flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center}
#stage svg{max-width:100%;max-height:100%;width:auto;height:auto;display:block}
body.card #stage svg{border-radius:18px;box-shadow:0 6px 22px rgba(20,30,50,.22);background:#fff}
#label{flex:none;margin-top:6px;max-width:96%;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(20,30,50,.18);
  font:600 15px/1.3 Allimjang,Freesentation,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#label small{font:500 12px Freesentation,sans-serif;color:var(--sub);margin-left:6px}
#tools{position:absolute;top:6px;right:6px;display:flex;gap:4px;opacity:0;transition:opacity .2s;-webkit-app-region:no-drag}
#vClock:hover #tools{opacity:1}
#tools button{width:30px;height:30px;border:0;border-radius:9px;background:rgba(255,255,255,.95);box-shadow:0 2px 8px rgba(20,30,50,.25);cursor:pointer;font-size:15px;line-height:30px;padding:0}
#tools button:hover{background:#fff;transform:translateY(-1px)}
#msg{padding:16px 18px;border-radius:16px;background:rgba(255,255,255,.96);box-shadow:0 4px 16px rgba(20,30,50,.2);text-align:center;font-size:14px;line-height:1.5;max-width:90%;-webkit-app-region:no-drag}
#msg b{display:block;font-size:16px;margin-bottom:4px}
#msg button{margin-top:8px}

/* ── 설정 ── */
#vSet{position:fixed;inset:0;background:var(--bg);overflow:auto;user-select:text}
.top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line);-webkit-app-region:drag}
.top img{width:30px;height:30px}
.top h1{margin:0;font:700 19px Allimjang,sans-serif;flex:1}
.top .btn{-webkit-app-region:no-drag}
.wrap{max-width:860px;margin:0 auto;padding:16px 18px 30px;display:grid;gap:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.box h2{margin:0 0 10px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.box h2 i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--pt);color:#fff;font-size:12px;display:inline-grid;place-items:center}
.box h2 small{font-weight:400;color:var(--sub);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],select{height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;outline:none}
input[type=text]:focus,select:focus{border-color:var(--pt)}
#fSchool{flex:1;min-width:200px}
.btn{height:40px;padding:0 16px;border:0;border-radius:10px;background:var(--pt2);color:var(--pt);font-weight:700;cursor:pointer;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(.97)}
.btn.pri{background:var(--pt);color:#fff}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
#schList{margin-top:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
#schList button{display:flex;justify-content:space-between;gap:10px;width:100%;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;cursor:pointer}
#schList button:hover{background:var(--pt2)}
#schList small{color:var(--sub)}
#schList .none{padding:12px;color:var(--sub);font-size:14px}
.picked{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--pt2)}
.picked b{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.it{position:relative;border:2px solid var(--line);border-radius:14px;background:#fff;padding:6px;cursor:pointer;text-align:center;transition:transform .15s,border-color .15s,box-shadow .15s}
.it:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(20,30,50,.12)}
.it.on{border-color:var(--pt);box-shadow:0 0 0 3px rgba(47,123,246,.18)}
.it .th{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#f3f5f8;overflow:hidden}
.it .th svg{max-width:100%;max-height:100%}
.it b{display:block;margin-top:5px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it span{display:block;font-size:12px;color:var(--sub)}
.it em{position:absolute;top:8px;left:8px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--pt);color:#fff;font:800 13px/24px Freesentation;font-style:normal}
.hint{margin:8px 0 0;font-size:13px;color:var(--sub)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:600}
.seg button[aria-pressed=true]{background:var(--pt);color:#fff}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px dashed var(--line)}
.opt:first-of-type{border-top:0}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:13px;background:#cfd6de;transition:background .2s;pointer-events:none}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--pt)}
.sw input:checked+span::after{transform:translateX(20px)}
.dots{width:30px;height:8px;background:radial-gradient(circle,#c5ced8 3px,transparent 3.5px) 0 0/10px 8px repeat-x;animation:dt 1s infinite linear;opacity:.8}
@keyframes dt{50%{opacity:.3}}
.empty{padding:18px;text-align:center;color:var(--sub);font-size:14px;grid-column:1/-1}
footer{text-align:center;font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<section id="vClock" hidden>
  <div id="stage"></div>
  <div id="label" hidden></div>
  <div id="tools">
    <button id="tPrev" title="이전 시계">◀</button><button id="tNext" title="다음 시계">▶</button>
    <button id="tSmall" title="작게">－</button><button id="tBig" title="크게">＋</button>
    <button id="tSet" title="설정">⚙️</button>
  </div>
</section>

<section id="vSet" hidden>
  <div class="top"><img src="../favicon.png" alt=""><h1>우리 반 시계 위젯</h1><button class="btn pri" id="bDone">다 됐어요</button></div>
  <div class="wrap">
    <div class="box">
      <h2><i>1</i>우리 반 고르기</h2>
      <div id="schPicked" class="picked" hidden><b id="schName"></b><button class="btn sm" id="schChange">학교 바꾸기</button></div>
      <div id="schSearch"><div class="row"><input type="text" id="fSchool" placeholder="학교 이름을 써 주세요 (예: 부천북초)" autocomplete="off"></div><div id="schList" hidden></div></div>
      <div class="row" style="margin-top:10px">
        <select id="fGrade"><option value="">학년</option></select>
        <select id="fBan"><option value="">반</option></select>
      </div>
    </div>
    <div class="box">
      <h2><i>2</i>띄울 시계 고르기 <small id="pickInfo"></small></h2>
      <div class="row"><button class="btn sm" id="bAll">모두 고르기</button><button class="btn sm" id="bNone">모두 풀기</button><button class="btn sm" id="bReload">새로 불러오기</button></div>
      <p class="hint">하나를 고르면 그 시계만 떠요. 여러 개를 고르면 고른 순서대로 돌아가며 보여요. 아무것도 안 고르면 우리 반 시계가 모두 돌아가요.</p>
      <div class="grid" id="grid"><div class="empty">학교·학년·반을 고르면 우리 반 시계가 나와요.</div></div>
    </div>
    <div class="box">
      <h2><i>3</i>보기 설정</h2>
      <div class="opt"><span>시계 바꾸는 간격</span><div class="seg" id="segEvery"></div></div>
      <div class="opt"><span>순서</span><div class="seg" id="segOrder"></div></div>
      <div class="opt"><span>배경</span><div class="seg" id="segBg"></div></div>
      <div class="opt"><span>이름표 보이기 (시계 이름 · 만든 친구)</span><label class="sw"><input type="checkbox" id="oLabel"><span></span></label></div>
      <div class="opt desk" hidden><span>항상 다른 창 위에 띄우기</span><label class="sw"><input type="checkbox" id="oTop"><span></span></label></div>
      <div class="opt desk" hidden><span>컴퓨터 켤 때 저절로 켜기</span><label class="sw"><input type="checkbox" id="oAuto"><span></span></label></div>
    </div>
    <footer>나도 장영실! 시계 발명가 · 우리 반 시계 위젯 · ⓒ 김예람(예람쌤)</footer>
  </div>
</section>

<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbwR3HEKVpni8dYBeX7pRr_soB-UKU_Jeba04igS1mBZJEiZS2cUCiPam0G8c7ke-38F/exec';
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=window.desk||null;                       // 데스크탑 앱이면 창 조절 기능이 있어요
if(!D)document.body.classList.add('web');else document.querySelectorAll('.desk').forEach(e=>e.hidden=false);
const KEY='cw-set';
let S={school:null,grade:'',ban:'',pick:[],every:5,order:'seq',bg:'clear',label:true,size:300};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};

async function api(body){const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(Object.assign({dev:'widget'},body))});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'잠시 뒤 다시 해 주세요.');return j;}

/* ── 시계 그리기 (시계 발명가와 같은 모양) ── */
const SEG={a:[.12,0,.76,.2],b:[.8,.12,.2,.76],c:[.8,1.12,.2,.76],d:[.12,1.8,.76,.2],e:[0,1.12,.2,.76],f:[0,.12,.2,.76],g:[.12,.9,.76,.2]};
const DIG=['abcdef','bc','abged','abgcd','fgbc','afgcd','afgedc','abc','abcdefg','abcdfg'];
function segDigit(n,x,col,halo){return Object.keys(SEG).map(k=>{const q=SEG[k],on=n!=null&&DIG[n].includes(k);
  return `<rect x="${(x+q[0]).toFixed(3)}" y="${q[1]}" width="${q[2]}" height="${q[3]}" rx=".09" style="fill:${col};${on?`stroke:${halo};stroke-width:.06;paint-order:stroke`:'opacity:.1'}"/>`;}).join('');}
function digitBody(c){const d=new Date(),hh=d.getHours(),m=d.getMinutes(),s=d.getSeconds(),h12=hh%12||12,ap=hh<12?'오전':'오후';
  const col=c.hand,halo=col==='#ffffff'?'rgba(0,0,0,.35)':'rgba(0,0,0,.2)',on=s%2===0;
  return `<text x=".55" y=".62" text-anchor="middle" style="font:800 .52px Freesentation,sans-serif;fill:${col}">${ap}</text>
    <g transform="skewX(-6)">${segDigit(h12>=10?1:null,1.4,col,halo)}${segDigit(h12%10,2.65,col,halo)}
    <circle cx="4.15" cy=".62" r=".13" style="fill:${col};opacity:${on?1:.15}"/><circle cx="4.05" cy="1.38" r=".13" style="fill:${col};opacity:${on?1:.15}"/>
    ${segDigit(Math.floor(m/10),4.45,col,halo)}${segDigit(m%10,5.7,col,halo)}</g>`;}
const HAND_H='M95.6,110 L94.6,100 L97.2,66 Q100,59 102.8,66 L105.4,100 L104.4,110 Q100,113 95.6,110 Z';
const HAND_M='M97.6,113 L96.8,100 L98.7,45 Q100,39 101.3,45 L103.2,100 L102.4,113 Q100,115.5 97.6,113 Z';
function angles(){const d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();return [((h%12)+m/60)*30,(m+s/60)*6,s*6];}
let N=0;
function clockSVG(c,clear){const W=1000,H=W*c.h/c.w,bgr=clear?'':`<rect width="${W}" height="${H.toFixed(1)}" style="fill:#ffffff"/>`;
  if(c.kind==='digital'){const z=c.size||1,bx=c.bx*W,by=c.by*H,bw=c.bw*W,bh=c.bh*H,U=6.7,sc=Math.min(bw*.86/U,bh*.7/2)*Math.min(z,1.15);
    const ox=bx+(bw-U*sc)/2,oy=by+(bh-2*sc)/2;
    return `<svg class="clk" data-kind="digital" data-id="${esc(c.id)}" viewBox="0 0 ${W} ${H.toFixed(1)}">${bgr}<image href="${c.src}" x="0" y="0" width="${W}" height="${H.toFixed(1)}"/>
      <g class="dg" transform="translate(${ox.toFixed(1)} ${oy.toFixed(1)}) scale(${sc.toFixed(3)})">${digitBody(c)}</g></svg>`;}
  const X=c.cx*W,Y=c.cy*H,k=(c.r*W)/66*(c.size||1),[ha,ma,sa]=angles(),hc=c.hand,mc=c.min||c.hand,sc=c.sec||'#e5484d',id='sh'+(++N);
  const edge=x=>x==='#ffffff'?'rgba(30,36,48,.55)':'rgba(0,0,0,.28)';
  return `<svg class="clk" data-kind="analog" viewBox="0 0 ${W} ${H.toFixed(1)}"><defs><filter id="${id}" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="1.2" dy="2" stdDeviation="1.3" flood-color="#000" flood-opacity=".32"/></filter></defs>
    ${bgr}<image href="${c.src}" x="0" y="0" width="${W}" height="${H.toFixed(1)}"/>
    <g transform="translate(${X.toFixed(1)} ${Y.toFixed(1)}) scale(${k.toFixed(4)}) translate(-100 -100)" filter="url(#${id})">
    <path class="hh" d="${HAND_H}" transform="rotate(${ha.toFixed(2)} 100 100)" style="fill:${hc};stroke:${edge(hc)};stroke-width:.7"/>
    <path class="mh" d="${HAND_M}" transform="rotate(${ma.toFixed(2)} 100 100)" style="fill:${mc};stroke:${edge(mc)};stroke-width:.7"/>
    <circle cx="100" cy="100" r="5.6" style="fill:${mc};stroke:${edge(mc)};stroke-width:.7"/>
    <g class="sh" transform="rotate(${sa} 100 100)"><line x1="100" y1="118" x2="100" y2="36" style="stroke:${sc};stroke-width:1.5;stroke-linecap:round"/><circle cx="100" cy="114" r="3" style="fill:${sc}"/></g>
    <circle cx="100" cy="100" r="3" style="fill:${sc}"/><circle cx="99.2" cy="99.2" r="1" style="fill:#fff;opacity:.7"/></g></svg>`;}
function tick(){const [ha,ma,sa]=angles();
  document.querySelectorAll('svg.clk').forEach(svg=>{
    if(svg.dataset.kind==='analog'){const q=s=>svg.querySelector(s);q('.hh').setAttribute('transform',`rotate(${ha.toFixed(2)} 100 100)`);q('.mh').setAttribute('transform',`rotate(${ma.toFixed(2)} 100 100)`);q('.sh').setAttribute('transform',`rotate(${sa} 100 100)`);}
    else{const c=byId[svg.dataset.id],g=svg.querySelector('.dg');if(c&&g)g.innerHTML=digitBody(clockOf(c));}});}
setInterval(tick,1000);

/* ── 작품 불러오기 ── */
let items=[],byId={},img={},loaded=false;
const eq=(a,b)=>String(a??'').trim()===String(b??'').trim();
const shortSchool=n=>String(n||'').replace(/등학교$/,'').replace(/학교$/,'');
function mine(){if(!S.school||!S.grade||!S.ban)return [];
  return items.filter(x=>(!x.school||eq(x.school,S.school.name))&&eq(x.grade,S.grade)&&eq(x.ban,S.ban));}
function clockOf(it){const im=img[it.clockId];if(!im)return null;
  return {id:it.id,src:im.src,w:im.w,h:im.h,kind:it.kind==='digital'?'digital':'analog',cx:+it.cx,cy:+it.cy,r:+it.r,bx:+it.bx,by:+it.by,bw:+it.bw,bh:+it.bh,hand:it.hand,min:it.min||it.hand,sec:it.sec||'#e5484d',size:+it.size||1};}
const loadImg=src=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src;});
async function getImg(id){if(img[id])return img[id];
  try{const src='https://lh3.googleusercontent.com/d/'+id+'=s900-rw',im=await loadImg(src);return img[id]={src,w:im.naturalWidth,h:im.naturalHeight};}
  catch(e){const j=await api({action:'img',ids:[id]}),src=(j.images||{})[id];if(!src)throw e;const im=await loadImg(src);return img[id]={src,w:im.naturalWidth,h:im.naturalHeight};}}
async function load(){const j=await api({action:'list'});items=(j.items||[]).sort((a,b)=>(+b.time||0)-(+a.time||0));byId={};items.forEach(x=>byId[x.id]=x);loaded=true;}

/* ── 시계 보기 ── */
let cur=-1,timer=null;
function queue(){const L=mine();if(!L.length)return [];
  const p=S.pick.filter(id=>L.some(x=>x.id===id)).map(id=>byId[id]);return p.length?p:L;}
function msg(t,sub,btn){$('stage').innerHTML=`<div id="msg"><b>${t}</b>${sub||''}${btn?'<br><button class="btn sm" id="mSet">설정 열기</button>':''}</div>`;$('label').hidden=true;
  if(btn)$('mSet').onclick=openSet;if(D)D.clock(Math.max(S.size,260),200);}
async function show(step){const Q=queue();$('tPrev').hidden=$('tNext').hidden=Q.length<2;
  if(!S.school||!S.grade||!S.ban)return msg('우리 반을 골라 주세요','설정에서 학교·학년·반을 고르면 우리 반 시계가 떠요.',true);
  if(!Q.length)return msg('아직 우리 반 시계가 없어요','시계 갤러리에 올리면 여기에 떠요.',true);
  if(S.order==='rand'&&step===1&&Q.length>1){let n;do n=Math.floor(Math.random()*Q.length);while(n===cur);cur=n;}
  else cur=((cur<0?0:cur+(step||0))%Q.length+Q.length)%Q.length;
  const it=Q[cur];
  try{await getImg(it.clockId);}catch(e){return msg('시계 그림을 불러오지 못했어요','인터넷 연결을 확인해 주세요.');}
  const c=clockOf(it);$('stage').innerHTML=clockSVG(c,S.bg==='clear');
  const L=$('label');L.hidden=!S.label;L.innerHTML=`${esc(it.name||'이름 없는 시계')}<small>${esc(it.num?it.num+'번 ':'')}${esc(it.maker||'')}</small>`;
  fit(c);plan();}
function fit(c){if(!D)return;const w=S.size,h=Math.round(w*c.h/c.w)+(S.label?40:0)+6;D.clock(w,h);}
function plan(){clearTimeout(timer);const Q=queue();if(Q.length>1)timer=setTimeout(()=>show(1),S.every*60000);}
$('tPrev').onclick=()=>show(-1);$('tNext').onclick=()=>show(1);
$('tSmall').onclick=()=>{S.size=Math.max(140,S.size-40);save();const it=queue()[cur];if(it&&clockOf(it))fit(clockOf(it));};
$('tBig').onclick=()=>{S.size=Math.min(900,S.size+40);save();const it=queue()[cur];if(it&&clockOf(it))fit(clockOf(it));};
$('tSet').onclick=()=>openSet();
async function openClock(){$('vSet').hidden=true;$('vClock').hidden=false;document.body.classList.toggle('card',S.bg==='card');
  if(D)D.setMode('clock');
  if(!loaded){msg('시계를 불러오고 있어요','<div class="dots" style="margin:6px auto 0"></div>');try{await load();}catch(e){return msg('시계를 불러오지 못했어요','인터넷 연결을 확인해 주세요. 1분 뒤 다시 해 볼게요.');}}
  cur=-1;show(0);}
// 5분마다 새 작품을 확인해요 (선생님이 지운 작품은 빠지고, 새로 올린 작품은 들어와요)
setInterval(async()=>{if($('vClock').hidden)return;const had=loaded;try{await load();}catch(e){return;}if(!had||!$('stage').querySelector('svg'))show(0);},300000);

/* ── 설정 ── */
for(let i=1;i<=6;i++)$('fGrade').insertAdjacentHTML('beforeend',`<option value="${i}">${i}학년</option>`);
for(let i=1;i<=15;i++)$('fBan').insertAdjacentHTML('beforeend',`<option value="${i}">${i}반</option>`);
function setSchool(sc){S.school=sc;save();$('schPicked').hidden=!sc;$('schSearch').hidden=!!sc;$('schList').hidden=true;
  if(sc)$('schName').textContent=sc.name+(sc.addr?' · '+sc.addr:'');else{$('fSchool').value='';setTimeout(()=>$('fSchool').focus(),50);}drawGrid();}
$('schChange').onclick=()=>setSchool(null);
let schT=null,schQ='';
$('fSchool').addEventListener('input',()=>{clearTimeout(schT);const q=$('fSchool').value.trim(),L=$('schList');if(q.length<2){L.hidden=true;return;}
  schT=setTimeout(async()=>{schQ=q;L.hidden=false;L.innerHTML='<div class="none">찾는 중…</div>';
    try{const j=await api({action:'school',q});if(schQ!==q)return;const list=j.schools||[];
      L.innerHTML=list.length?list.map((x,i)=>`<button type="button" data-i="${i}"><b>${esc(x.name)}</b><small>${esc(x.addr||x.region||'')}</small></button>`).join(''):'<div class="none">학교를 찾지 못했어요. 이름을 다시 써 볼까요?</div>';
      L.querySelectorAll('button').forEach(b=>b.onclick=()=>setSchool({name:list[+b.dataset.i].name,addr:list[+b.dataset.i].addr||''}));}
    catch(e){L.innerHTML=`<div class="none">${esc(e.message)}</div>`;}},350);});
$('fGrade').onchange=()=>{S.grade=$('fGrade').value;save();drawGrid();};
$('fBan').onchange=()=>{S.ban=$('fBan').value;save();drawGrid();};
function seg(id,list,key){const el=$(id);el.innerHTML=list.map(([v,l])=>`<button data-v="${v}" aria-pressed="${String(S[key])===String(v)}">${l}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{S[key]=typeof S[key]==='number'?+b.dataset.v:b.dataset.v;save();seg(id,list,key);});}
async function drawGrid(){const G=$('grid'),L=mine();
  if(!S.school||!S.grade||!S.ban){G.innerHTML='<div class="empty">학교·학년·반을 고르면 우리 반 시계가 나와요.</div>';$('pickInfo').textContent='';return;}
  if(!loaded){G.innerHTML='<div class="empty"><div class="dots" style="margin:auto"></div></div>';try{await load();}catch(e){G.innerHTML=`<div class="empty">${esc(e.message)}</div>`;return;}return drawGrid();}
  S.pick=S.pick.filter(id=>byId[id]);save();
  $('pickInfo').textContent=L.length?(S.pick.length?`${S.pick.length}개 골랐어요`:`우리 반 시계 ${L.length}개 · 모두 돌아가요`):'';
  if(!L.length){G.innerHTML=`<div class="empty">${esc(shortSchool(S.school.name))} ${S.grade}학년 ${S.ban}반에는 아직 올라온 시계가 없어요.</div>`;return;}
  G.innerHTML=L.map(it=>{const c=clockOf(it),n=S.pick.indexOf(it.id);
    return `<div class="it${n>=0?' on':''}" data-id="${esc(it.id)}">${n>=0?`<em>${n+1}</em>`:''}<div class="th">${c?clockSVG(c,false):'<div class="dots"></div>'}</div><b>${esc(it.name||'이름 없는 시계')}</b><span>${esc(it.num?it.num+'번 ':'')}${esc(it.maker||'')}</span></div>`;}).join('');
  G.querySelectorAll('.it').forEach(el=>el.onclick=()=>{const id=el.dataset.id,n=S.pick.indexOf(id);if(n>=0)S.pick.splice(n,1);else S.pick.push(id);save();drawGrid();});
  const need=L.filter(it=>!img[it.clockId]);if(need.length){let n=0;await Promise.all(need.map(it=>getImg(it.clockId).then(()=>{if(++n%6===0)drawGrid();}).catch(()=>{})));drawGrid();}}
$('bAll').onclick=()=>{S.pick=mine().map(x=>x.id);save();drawGrid();};
$('bNone').onclick=()=>{S.pick=[];save();drawGrid();};
$('bReload').onclick=async()=>{loaded=false;drawGrid();};
$('oLabel').onchange=()=>{S.label=$('oLabel').checked;save();};
async function openSet(){clearTimeout(timer);$('vClock').hidden=true;$('vSet').hidden=false;document.body.classList.remove('card');if(D)D.setMode('settings');
  if(S.school)setSchool(S.school);else setSchool(null);$('fGrade').value=S.grade;$('fBan').value=S.ban;$('oLabel').checked=S.label;
  seg('segEvery',[[1,'1분'],[3,'3분'],[5,'5분'],[10,'10분'],[30,'30분'],[60,'1시간']],'every');
  seg('segOrder',[['seq','고른 순서'],['rand','섞어서']],'order');
  seg('segBg',[['clear','투명'],['card','흰 카드']],'bg');
  if(D){const st=await D.state();$('oTop').checked=st.top;$('oAuto').checked=st.auto;}
  drawGrid();}
if(D){$('oTop').onchange=()=>D.set('top',$('oTop').checked);$('oAuto').onchange=()=>D.set('auto',$('oAuto').checked);D.onOpenSettings(()=>openSet());}
$('bDone').onclick=()=>openClock();
if(S.school&&S.grade&&S.ban&&!/[?&]set\b/.test(location.search))openClock();else openSet();
})();
</script>
</body>
</html>
